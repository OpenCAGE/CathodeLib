name: publish to nuget
on:
  push:
    branches:
      - master # Default release branch

permissions:
  contents: write

jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build
        run: dotnet build CathodeLib/CathodeLib.csproj --configuration Release

      - name: Check for version change
        id: version_check
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' CathodeLib/CathodeLib.csproj | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to extract <Version> from CathodeLib/CathodeLib.csproj"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected project version: $VERSION"

          PUBLISHED_VERSIONS=$(curl -s -f https://api.nuget.org/v3-flatcontainer/cathodelib/index.json || echo "")
          if echo "$PUBLISHED_VERSIONS" | grep -q "\"$VERSION\""; then
            echo "Version $VERSION already exists on NuGet. Skipping publish."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found new version ($VERSION) of CathodeLib."
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack & publish to NuGet
        if: steps.version_check.outputs.is_new == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet pack CathodeLib/CathodeLib.csproj --no-build --configuration Release --output ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate \
            --no-symbols

      - name: Tag release
        if: steps.version_check.outputs.is_new == 'true'
        run: |
          TAG="v${{ steps.version_check.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi